syntax = "proto3";

package hydra.proxy.v1;

import "google/protobuf/timestamp.proto";

// Internal only. Transport: Unix domain socket (/run/hydra/proxy.sock).
// The proxy MUST authenticate the local Core process using socket permissions
// and peer credentials. Actor fields are attribution, not credentials.
service ProxyControl {
  rpc GetStatus(GetStatusRequest) returns (ProxyStatus);
  rpc ConfigureHistory(ConfigureHistoryRequest) returns (ConfigureHistoryReply);
  rpc GetRequestCheckerSettings(GetRequestCheckerSettingsRequest) returns (RequestCheckerSettings);
  rpc SetRequestCheckerSettings(SetRequestCheckerSettingsRequest) returns (RequestCheckerSettings);
  rpc ListRequestCheckerPrograms(GetRequestCheckerSettingsRequest) returns (RequestCheckerPrograms);
  rpc PutRequestCheckerProgram(PutRequestCheckerProgramRequest) returns (RequestCheckerPrograms);
  rpc DeleteRequestCheckerProgram(DeleteRequestCheckerProgramRequest) returns (RequestCheckerPrograms);
  rpc ApplyConfigSnapshot(ApplyConfigSnapshotRequest) returns (ApplyResult);
  rpc ApplyServiceSnapshot(ApplyServiceSnapshotRequest) returns (ApplyResult);
  rpc ApplyRuleSnapshot(ApplyRuleSnapshotRequest) returns (ApplyResult);
  rpc InstallProtocol(InstallProtocolRequest) returns (InstallProtocolResult);
  rpc ActivateProtocol(ActivateProtocolRequest) returns (ApplyResult);
  rpc DeactivateProtocol(DeactivateProtocolRequest) returns (ApplyResult);
}

service ProxyTelemetry {
  // Lossy, bounded, parsed events only; no raw packet stream.
  rpc StreamTelemetry(StreamTelemetryRequest) returns (stream EventBatch);
  // Critical events are replayed by (proxy_epoch, sequence) until acknowledged.
  rpc StreamCritical(StreamCriticalRequest) returns (stream EventBatch);
  rpc AckCritical(AckCriticalRequest) returns (AckCriticalReply);
}

service ProxyDiagnostics {
  // Explicit, on-demand raw sample from bounded local proxy buffer.
  rpc TestProtocol(TestProtocolRequest) returns (TestProtocolReply);
  rpc CaptureSample(CaptureSampleRequest) returns (CaptureSampleReply);
  rpc GetSample(GetSampleRequest) returns (GetSampleReply);
  rpc GetFlowHistory(GetFlowHistoryRequest) returns (GetFlowHistoryReply);
  // On-demand tail of an active flow from the bounded in-memory buffer.
  // Additive: completed flows keep using GetFlowHistory.
  rpc GetActiveFlowHistory(GetActiveFlowHistoryRequest) returns (GetActiveFlowHistoryReply);
  rpc SetFlowFavorite(SetFlowFavoriteRequest) returns (SetFlowFavoriteReply);
  // Replays retained flows locally and returns only filter outcome metadata.
  rpc PreviewFilter(PreviewFilterRequest) returns (PreviewFilterReply);
  // ONLY to a configured service upstream on the competition allowlist.
  // Does not inject arbitrary packets into pre-existing connections.
  rpc ProbeService(ProbeServiceRequest) returns (ProbeServiceReply);
}

enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  ACTOR_TYPE_USER = 1;
  ACTOR_TYPE_SYSTEM = 2;
  ACTOR_TYPE_LOCAL_CLI = 3;
  ACTOR_TYPE_SERVICE = 4;
}
message Actor {
  ActorType type = 1;
  string user_id = 2;
  string username = 3;
  string initiated_by_user_id = 4;
  string request_id = 5;
}

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_TCP = 1;
  TRANSPORT_UDP = 2;
}
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_CLIENT_TO_SERVER = 1;
  DIRECTION_SERVER_TO_CLIENT = 2;
}
enum RuleMode {
  RULE_MODE_UNSPECIFIED = 0;
  RULE_MODE_SHADOW = 1;
  RULE_MODE_ENFORCE = 2;
}
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_ALLOW = 1;
  ACTION_ALERT = 2;
  ACTION_BLOCK = 3;
  ACTION_DROP_CONNECTION = 4;
  ACTION_DROP_DATAGRAM = 5;
  ACTION_RATE_LIMIT = 6;
  ACTION_TAG = 7;
  ACTION_LOG = 8;
}
enum Comparison {
  COMPARISON_UNSPECIFIED = 0;
  COMPARISON_EQUALS = 1;
  COMPARISON_NOT_EQUALS = 2;
  COMPARISON_CONTAINS = 3;
  COMPARISON_REGEX = 4;
  COMPARISON_PREFIX = 5;
  COMPARISON_GREATER_THAN = 6;
  COMPARISON_LESS_THAN = 7;
  COMPARISON_IN = 8;
  COMPARISON_NOT_IN = 9;
}

// Typed arbitrary fields allow plugins to emit binary and 64-bit integers
// without lossy JSON number conversion.
message FieldValue {
  oneof value {
    string string_value = 1;
    sint64 int_value = 2;
    uint64 uint_value = 3;
    double double_value = 4;
    bool bool_value = 5;
    bytes bytes_value = 6;
    FieldObject object_value = 7;
    FieldList list_value = 8;
  }
}
message FieldObject { map<string, FieldValue> fields = 1; }
message FieldList { repeated FieldValue values = 1; }
message Predicate {
  string field_path = 1;       // e.g. protocol.command or network.src_ip
  Comparison comparison = 2;
  FieldValue expected = 3;
}
message RuleGroup { repeated RuleExpression children = 1; }
// Direction-scoped expressions are inapplicable outside their side, including under NOT.
message DirectionScope {
  Direction direction = 1;
  RuleExpression expression = 2;
}
message RuleExpression {
  oneof node {
    RuleGroup all = 1;
    RuleGroup any = 2;
    RuleExpression negated = 3;
    Predicate predicate = 4;
    DirectionScope direction_scoped = 5;
  }
}
message RateLimitOptions {
  string key = 1;            // e.g. network.src_ip
  uint32 requests = 2;
  uint64 window_ms = 3;
  Action on_exceed = 4;      // BLOCK, DROP_CONNECTION or DROP_DATAGRAM
}
message RuleActionConfig {
  optional uint32 http_status = 1;  // Only valid for parsed HTTP BLOCK
  RateLimitOptions rate_limit = 2; // Required for RATE_LIMIT
  string tag = 3;                 // Required for TAG
}
message Rule {
  string id = 1;
  string service_id = 2;
  string name = 3;
  bool enabled = 4;
  RuleMode mode = 5;
  uint32 priority = 6;
  RuleExpression expression = 7;
  Action action = 8;
  string backend = 9;         // userspace initially; backend is an abstraction
  string description = 10;
  RuleActionConfig action_config = 11;
  google.protobuf.Timestamp expires_at = 12;
  repeated string additional_service_ids = 13;
}

message ServiceConfig {
  string id = 1;
  Transport transport = 2;
  string listen_address = 3;
  string upstream_address = 4;
  string protocol_id = 5;
  bool enabled = 6;
  bool retain_history = 7;
  ServiceProtection protection = 8;
  ForwardingConfig forwarding = 9;
  ServiceTls tls = 10;
}
// TLS termination and/or upstream TLS for one service. PEM material stays on this
// local socket and is never returned by the HTTP API.
message ServiceTls {
  bool terminate = 1;
  bool upstream = 2;
  bool insecure = 3;
  string certificate_pem = 4;
  string private_key_pem = 5;
  string server_name = 6;
}
message ServiceProtection {
  uint64 max_active_flows = 1;
  uint64 tcp_connections_per_second = 2;
  uint64 udp_datagrams_per_second = 3;
  uint64 bytes_per_second = 4;
  uint64 idle_timeout_ms = 5;
}
message ServiceMetrics {
  string service_id = 1;
  uint64 active_flows = 2;
  uint64 accepted_flows = 3;
  uint64 rejected_flows = 4;
  uint64 bytes_client_to_server = 5;
  uint64 bytes_server_to_client = 6;
  uint64 dropped_datagrams = 7;
  uint64 rate_limited = 8;
}
// Persistent per-service disk budget for completed compressed traffic, including metadata.
message ConfigureHistoryRequest {
  uint64 per_service_bytes = 1;
  Actor actor = 2;
  string request_id = 3;
  int32 compression_level = 4;
}
message ConfigureHistoryReply {
  uint64 per_service_bytes = 1;
  int32 compression_level = 2;
}
message GetStatusRequest {}
message ProxyStatus {
  string proxy_instance_id = 1;
  string proxy_epoch_id = 2;
  uint64 applied_rules_revision = 3;
  uint64 applied_services_revision = 4;
  uint32 active_flows = 5;
  uint64 dropped_telemetry_events = 6;
  uint64 critical_spool_bytes = 7;
  google.protobuf.Timestamp started_at = 8;
  uint64 rejected_flows = 9;
  uint64 dropped_udp_datagrams = 10;
  map<string, uint64> rule_hit_counts = 11;
  uint64 critical_dropped = 12;
  uint64 sample_dropped = 13;
  uint64 history_per_service_bytes = 14;
  uint64 history_dropped = 15;
  int32 history_compression_level = 16;
  repeated ServiceMetrics service_metrics = 17;
  ForwardingStats forwarding_stats = 18;
  uint64 request_checker_errors = 19;
  string last_request_checker_error = 20;
}
message RequestCheckerPolicy {
  string id = 1;
  repeated string services = 2;
  uint64 timeout_ms = 3;
  bool allow_on_error = 4;
}
message RequestCheckerSettings {
  uint64 revision = 1;
  repeated RequestCheckerPolicy policies = 2;
}
message GetRequestCheckerSettingsRequest {
  Actor actor = 1;
  string request_id = 2;
}
message SetRequestCheckerSettingsRequest {
  RequestCheckerSettings settings = 1;
  Actor actor = 2;
  string request_id = 3;
}
message RequestCheckerProgram { string id = 1; string runtime = 2; bool managed = 3; string source = 4; }
message RequestCheckerPrograms { uint64 revision = 1; repeated RequestCheckerProgram programs = 2; }
message PutRequestCheckerProgramRequest { Actor actor = 1; string request_id = 2; uint64 revision = 3; string id = 4; string source = 5; }
message DeleteRequestCheckerProgramRequest { Actor actor = 1; string request_id = 2; uint64 revision = 3; string id = 4; }
message ApplyServiceSnapshotRequest {
  uint64 revision = 1;
  string request_id = 2;
  Actor actor = 3;
  repeated ServiceConfig services = 4;
}
message ApplyRuleSnapshotRequest {
  uint64 revision = 1;
  string request_id = 2;
  Actor actor = 3;
  repeated Rule rules = 4;
}
// Atomic dependent services and rules; both nested revisions must agree.
message ApplyConfigSnapshotRequest {
  ApplyServiceSnapshotRequest services = 1;
  ApplyRuleSnapshotRequest rules = 2;
}
message ApplyResult {
  uint64 applied_revision = 1;
  bool applied = 2;
  string error_code = 3;
  string error_message = 4;
  google.protobuf.Timestamp applied_at = 5;
}
message InstallProtocolRequest {
  string protocol_id = 1;
  string version = 2;
  string sha256_hex = 3;
  string framing_profile_json = 7; // mutually exclusive with wasm; bounded declarative profile
  bytes wasm = 4;              // hard cap 4 MiB, validate digest and runtime budgets
  string request_id = 5;
  Actor actor = 6;
}
message InstallProtocolResult {
  string metadata_json = 6; // optional bounded typed schema; null for legacy ABI v1 parsers
  string protocol_id = 1;
  string version = 2;
  string sha256_hex = 3;
  bool installed = 4;
  string error_message = 5;
}
message ActivateProtocolRequest {
  string protocol_id = 1;
  string version = 2;
  string service_id = 3;
  string request_id = 4;
  Actor actor = 5;
}

message StreamTelemetryRequest {
  uint32 max_events_per_batch = 1;
}
message StreamCriticalRequest {
  string proxy_epoch_id = 1;
  uint64 after_sequence = 2;
}
message EventBatch {
  string proxy_epoch_id = 1;
  uint64 first_sequence = 2;
  bool critical = 3;
  repeated Event events = 4;
}
message Event {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string service_id = 3;
  string flow_id = 4;
  oneof payload {
    FlowOpened flow_opened = 10;
    FlowClosed flow_closed = 11;
    ParsedMessage message = 12;
    RuleHit rule_hit = 13;
    FlagFinding flag = 14;
    ProxyCounters counters = 15;
    EventLoss loss = 16;
  }
}
message Endpoint {
  string ip = 1;
  uint32 port = 2;
}
message FlowOpened {
  Transport transport = 1;
  Endpoint client = 2;
  Endpoint upstream = 3;
}
message FlowClosed {
  uint64 bytes_client_to_server = 1;
  uint64 bytes_server_to_client = 2;
  string reason = 3;
  bool history_truncated = 4;
}
message HistorySegment {
  Direction direction = 1;
  bytes data = 2;
  // UDP records preserve whole datagrams, including zero-byte datagrams.
  bool datagram = 3;
  int64 occurred_at_ms = 4;
  uint64 sequence = 5;
}
message GetFlowHistoryRequest { string flow_id = 1; }
message GetFlowHistoryReply {
  string flow_id = 1;
  string service_id = 2;
  string protocol_id = 3;
  int64 opened_at_ms = 4;
  int64 closed_at_ms = 5;
  uint64 bytes_client_to_server = 6;
  uint64 bytes_server_to_client = 7;
  repeated HistorySegment segments = 8;
  bool truncated_client_to_server = 9;
  bool truncated_server_to_client = 10;
  bool history_truncated = 11;
  Transport transport = 12;
  // Observed datagrams, including blocked traffic; byte totals above are forwarded bytes.
  uint64 datagrams_client_to_server = 13;
  uint64 datagrams_server_to_client = 14;
}
// Additive active-flow contract. Field numbers are frozen by the Streams design.
message GetActiveFlowHistoryRequest {
  string flow_id = 1;
  Actor actor = 2;          // audit provenance, never from user input
  string request_id = 3;    // Core request id, for correlation
  ActiveBytesCursor cursor = 4; // optional; omit for a full tail snapshot
}
message ActiveBytesCursor {
  uint64 client_sequence = 1;
  uint64 server_sequence = 2;
  uint64 client_head_dropped = 3;
  uint64 server_head_dropped = 4;
}
message GetActiveFlowHistoryReply {
  string flow_id = 1;
  string service_id = 2;
  string protocol_id = 3;
  int64 opened_at_ms = 4;
  bool active = 5;
  repeated HistorySegment segments = 6;   // same message as GetFlowHistoryReply.segments
  bool truncated_client_to_server = 7;
  bool truncated_server_to_client = 8;
  uint64 retained_client_to_server_bytes = 9;
  uint64 retained_server_to_client_bytes = 10;
  bool reset = 11;                        // true => replace, do not append
  uint64 client_sequence = 12;
  uint64 server_sequence = 13;
  uint64 client_head_dropped = 14;
  uint64 server_head_dropped = 15;
  int64 generated_at_ms = 16;
}
message FilterPreviewTarget {
  string flow_id = 1;
  FieldObject network_fields = 2;
}
message PreviewFilterRequest {
  repeated FilterPreviewTarget targets = 1;
  Rule rule = 2;
  Actor actor = 3;
  string request_id = 4;
}
message FilterPreviewResult {
  string flow_id = 1;
  string state = 2; // ready, partial, active, not_retained, decoder_error
  bool matched = 3;
  bool would_block = 4;
  uint32 matched_messages = 5;
}
message PreviewFilterReply { repeated FilterPreviewResult results = 1; }
message ParsedMessage {
  string message_id = 1;
  string protocol_id = 2;
  string message_type = 3;
  Direction direction = 4;
  FieldObject fields = 5;
  string sample_id = 6;      // on-demand only; may expire (NOT_FOUND)
  uint32 original_size = 7;
  bool truncated = 8;
}
message RuleHit {
  // True only when this hit actually enforces a block/drop, including exceeded rate limits.
  bool blocked = 5;
  string rule_id = 1;
  Action action = 2;
  RuleMode mode = 3;
  string message_id = 4;
}
message FlagFinding {
  string finding_id = 1;
  string flag_value = 2;      // empty for own_exposed: retain detection metadata only
  string source_kind = 3;     // own_exposed / unknown, never auto-submit own flag
  string message_id = 4;
  Direction direction = 5;
}
message ProxyCounters {
  uint64 active_flows = 1;
  uint64 total_flows = 2;
  uint64 rule_hits = 3;
  uint64 telemetry_dropped = 4;
}
message EventLoss {
  uint64 count = 1;
  string reason = 2;
}
message AckCriticalRequest {
  string proxy_epoch_id = 1;
  uint64 through_sequence = 2; // ack only after Core SQLite commit
}
message AckCriticalReply { uint64 acknowledged_through = 1; }
message TestProtocolRequest { string protocol_id = 1; string version = 2; string sample_id = 3; Direction direction = 4; string request_id = 5; Actor actor = 6; }
message TestProtocolReply { repeated ParsedMessage messages = 1; }
message CaptureSampleRequest { string flow_id = 1; string request_id = 2; Actor actor = 3; }
message CaptureSampleReply { string sample_id = 1; }
message GetSampleRequest { string sample_id = 1; }
message GetSampleReply {
  bytes data = 1;
  bool truncated = 2;
  google.protobuf.Timestamp expires_at = 3;
}
message ProbeServiceRequest {
  string service_id = 1;     // selects configured upstream; no arbitrary destination
  Transport transport = 2;
  bytes payload = 3;         // application data, not forged IP packets
  uint32 timeout_ms = 4;
  string request_id = 5;
  Actor actor = 6;
}
message ProbeServiceReply {
  bytes response = 1;
  bool truncated = 2;
  uint32 elapsed_ms = 3;
  string error_code = 4;
}

// Restore the service's configured native parser for new sessions only.
message DeactivateProtocolRequest {
  string service_id = 1;
  string request_id = 2;
  Actor actor = 3;
}

// Idempotent raw archive mutation; capacity errors never evict existing pins.
message SetFlowFavoriteRequest {
  string flow_id = 1;
  bool favorite = 2;
  Actor actor = 3;
  string request_id = 4;
}
message SetFlowFavoriteReply { string state = 1; } // ready, pending, partial (interrupted active snapshot), unavailable, removed

// Opt-in application forwarding; destination was resolved from a Core team record.
message ForwardingConfig {
  string team_id = 1;
  string target_address = 2;
  string flag_pattern = 3;
  oneof framing {
    bool http1 = 4;
    string delimiter = 5;
    ForwardLengthPrefix length_prefix = 6;
    bool datagram = 7;
  }
}
message ForwardLengthPrefix {
  uint32 offset = 1;
  uint32 width = 2;
  bool little_endian = 3;
  bool length_includes_header = 4;
}

message ForwardingStats {
  uint64 mappings = 1;
  uint64 reused = 2;
  uint64 restored = 3;
  uint64 errors = 4;
}
